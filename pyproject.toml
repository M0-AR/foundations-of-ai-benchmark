[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundations-bench"
version = "0.1.0"
description = "Fidelity-first benchmark of first-principles AI foundations on public and live data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Foundations-Bench Consortium" }]
keywords = ["reproducibility", "benchmark", "autograd", "transformers", "statistics", "live-data"]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "statsmodels>=0.14",
  "PyYAML>=6.0",
  "requests>=2.32",
  "torch>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
