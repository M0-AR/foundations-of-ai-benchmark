name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5"
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit and property tests
        run: python -m pytest -q
      - name: Validate committed artifacts
        run: python scripts/check_results.py
